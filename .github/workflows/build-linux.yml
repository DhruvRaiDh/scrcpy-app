name: Build Linux Binary

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Linux Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-dev libssl-dev wget

      - name: Download and Bundle ADB + scrcpy into binary
        run: |
          mkdir -p backend/bundled_tools
          
          # Download scrcpy (includes adb inside)
          echo "Downloading scrcpy Linux x86_64..."
          wget -q "https://github.com/Genymobile/scrcpy/releases/download/v3.3.1/scrcpy-linux-x86_64-v3.3.1.tar.gz" -O /tmp/scrcpy.tar.gz
          mkdir -p /tmp/scrcpy_extract
          tar -xzf /tmp/scrcpy.tar.gz -C /tmp/scrcpy_extract
          
          # Copy the binaries we need
          cp /tmp/scrcpy_extract/scrcpy-linux-x86_64-v3.3.1/scrcpy        backend/bundled_tools/scrcpy
          cp /tmp/scrcpy_extract/scrcpy-linux-x86_64-v3.3.1/scrcpy-server  backend/bundled_tools/scrcpy-server
          cp /tmp/scrcpy_extract/scrcpy-linux-x86_64-v3.3.1/adb            backend/bundled_tools/adb
          
          chmod +x backend/bundled_tools/scrcpy backend/bundled_tools/adb
          
          echo "Bundled tools:"
          ls -lh backend/bundled_tools/

      - name: Build Standalone Linux Executable
        run: |
          chmod +x build/build_linux.py
          python3 build/build_linux.py

      - name: Verify Binary and Create Launchers
        run: |
          file dist/linux/scrcpy-app
          ls -lh dist/linux/scrcpy-app
          chmod +x dist/linux/scrcpy-app

          # Create start.sh helper
          cat << 'EOF' > dist/linux/start.sh
#!/usr/bin/env bash
DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
chmod +x "$DIR/scrcpy-app"
"$DIR/scrcpy-app" "$@"
EOF
          chmod +x dist/linux/start.sh

          # Create install-shortcut.sh to add to Ubuntu App menu
          cat << 'EOF' > dist/linux/install-shortcut.sh
#!/usr/bin/env bash
DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
chmod +x "$DIR/scrcpy-app"
DESKTOP_FILE="$HOME/.local/share/applications/scrcpy-app.desktop"
mkdir -p "$HOME/.local/share/applications"
cat << DESKTOPEOF > "$DESKTOP_FILE"
[Desktop Entry]
Name=Android Control Center
Comment=Mirror and control Android devices via scrcpy
Exec=$DIR/scrcpy-app
Terminal=true
Type=Application
Categories=Utility;Development;
DESKTOPEOF
chmod +x "$DESKTOP_FILE"
echo "✅ Desktop shortcut created in Ubuntu Applications menu!"
EOF
          chmod +x dist/linux/install-shortcut.sh

          # Add README.txt
          cat << 'EOF' > dist/linux/README.txt
Android Control Center (Linux Standalone)
=========================================

How to run on Ubuntu:

Option 1: In terminal, run:
    bash start.sh
    (or ./scrcpy-app)

Option 2: Add to your Ubuntu Application Menu (1-click launch):
    bash install-shortcut.sh
    Then search "Android Control Center" in your apps!

Requirements:
- None! ADB and scrcpy are already bundled inside.
- Works 100% offline.
EOF

          ls -la dist/linux/

      - name: Upload Standalone Linux Package
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-app-linux
          path: dist/linux/
          retention-days: 14

